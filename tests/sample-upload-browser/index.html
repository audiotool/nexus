<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Upload Example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
      }
      input[type="text"],
      input[type="file"] {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        padding: 0.75rem 1.5rem;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 0.5rem;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      button.cancel {
        background: #dc3545;
      }
      #status {
        margin-top: 1rem;
        padding: 1rem;
        background: #f8f9fa;
        border-radius: 4px;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 0.875rem;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .checkbox-group input {
        width: auto;
      }
    </style>
  </head>
  <body>
    <h1>Sample Upload Example</h1>

    <div class="form-group">
      <label for="pat">Personal Access Token</label>
      <input type="text" id="pat" placeholder="Enter your PAT" />
    </div>

    <div class="form-group">
      <label for="file">Audio File</label>
      <input type="file" id="file" accept="audio/*" />
    </div>

    <div class="form-group">
      <label for="name">Display Name</label>
      <input type="text" id="name" placeholder="My Sample" />
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="preventClose" />
      <label for="preventClose">Prevent tab close during upload</label>
    </div>

    <button id="upload">Upload</button>
    <button id="cancel" class="cancel" disabled>Cancel</button>

    <div id="status">Ready</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
