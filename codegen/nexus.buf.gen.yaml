version: v2
clean: false # avoid removing existing files
plugins:
  # Typescript - own generators
  - local: ./codegen/bin/main_wrapper.js
    opt: target=ts
    strategy: all
    out: src/gen

inputs:
  # built by codegen/bin/build-image.ts
  - binary_image: codegen/.image.binpb
    paths:
      - audiotool/document/
